name: Publicar site do portfólio e demonstração (GitHub Pages)

# Execução MANUAL. Antes da primeira vez: Settings > Pages > Source = "GitHub Actions".
# Publica o site na raiz e a demonstração do FolhaDemo em /demo/. Os números do site vêm dos relatórios
# versionados em docs/qualidade/ (rode os testes e os geradores localmente antes de publicar).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - run: npm run build
        env:
          BASE_PATH: /folha-demo-playwright/demo/
      - run: cp -r dist site-dist/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deploy
        uses: actions/deploy-pages@v4
