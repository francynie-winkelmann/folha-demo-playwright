name: Controle de instabilidade

# Roda toda segunda-feira e sob demanda. Executa a suíte várias vezes SEM retentativas
# e falha se algum teste mudar de resultado entre as repetições.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      repeticoes:
        description: 'Quantas vezes repetir a suíte'
        default: '5'

permissions:
  contents: read

jobs:
  instabilidade:
    name: Repetir a suíte e procurar testes instáveis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Medir instabilidade
        run: npm run instabilidade
        env:
          CI: 'true'
          REPETICOES: ${{ github.event.inputs.repeticoes || '5' }}
      - name: Resumo na página da execução
        if: always()
        run: cat docs/qualidade/instabilidade.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instabilidade
          path: docs/qualidade/instabilidade.*
          retention-days: 30
